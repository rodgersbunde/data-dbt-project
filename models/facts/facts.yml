version: 2

models:
  - name: fct_orders
    description: "Fact table containing one row per order"
    columns:
      - name: order_id
        tests:
          - not_null
          - unique

      - name: customer_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_customers')
              field: customer_id

      - name: order_date
        tests:
          - not_null

  - name: fct_order_details
    description: "Fact table containing one row per product per order"
    columns:
      - name: order_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_customers')  # or dim_orders if you have one
              field: customer_id

      - name: product_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_products')
              field: product_id

      - name: quantity
        tests:
          - not_null

      - name: line_total
        tests:
          - not_null

  - name: fct_payments
    description: "Fact table containing payment transactions"
    columns:
      - name: payment_id
        tests:
          - not_null
          - unique

      - name: order_id
        tests:
          - not_null
          - relationships:
              to: ref('fct_orders')
              field: order_id

      - name: amount
        tests:
          - not_null